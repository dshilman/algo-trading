name: DEMO-TRADING-EC2-DEPLOY

on:
  push:
    branches:
    - demo
  
jobs:
  deploy:
    name: Deploy to EC2 on demo branch push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the files
        uses: actions/checkout@v4

      - name: Create OANDA Config
        run: |          
          cat << EOF > config/oanda.cfg
          ${{ secrets.OANDA_CONFIG_DEMO }}
          EOF

      - name: Deploy to demo trading server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_HOST: ${{ vars.DEMO_REMOTE_HOST }}
          TARGET: ${{ vars.TARGET }}

      - name: Restart Trading
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.DEMO_REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |            
            cd ${{ vars.TARGET }}
            nohup ./restart_trading.sh >> restart_trading.log 2>&1 &

      - name: Update Crontab on Remote Server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.DEMO_REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ${{ vars.TARGET }}/config
            crontab crontab.txt
            echo "Crontab updated successfully!"

      - name: Install AWS CLI
        id: install-aws-cli
        uses: unfor19/install-aws-cli-action@master


      - name: Build Lambda
        working-directory: code/lambda
        run: |
          echo "create lambda zip"
          zip start_ec2_lambda.zip -r start_ec2_lambda.py
          zip stop_ec2_lambda.zip -r stop_ec2_lambda.py

      - name: Deploy Lambda
        working-directory: code/lambda
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          echo "deploy lambda"
          export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          export AWS_DEFAULT_REGION='us-east-1'
          aws lambda update-function-code --function-name start_ec2_lambda --zip-file fileb://start_ec2_lambda.zip
          aws lambda update-function-code --function-name stop_ec2_lambda --zip-file fileb://stop_ec2_lambda.zip
