name: Deploy-lambda

on:
  pull_request:
    branches:
      - demo
    paths:
      - '*code/lambda/*'
  push:
    branches:
      - demo
    paths:
      - '*code/lambda/*'
  
jobs:
  deploy:
    name: Deploy lambda
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::597782288487:role/algo-github-actions-role
          aws-region: us-east-1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install AWS SAM CLI
        run: pip install --upgrade aws-sam-cli

      - name: Deploy
        run: |
          cd ${{ vars.TARGET }}/code/lambda
          echo "create lambda zip"
          zip start_ec2_lambda.zip -r start_ec2_lambda.py
          zip stop_ec2_lambda.zip -r stop_ec2_lambda.py

          echo "deploy lambda"
          aws lambda update-function-code --function-name start_ec2_lambda --zip-file fileb://start_ec2_lambda.zip
          aws lambda update-function-code --function-name stop_ec2_lambda --zip-file fileb://stop_ec2_lambda.zip

