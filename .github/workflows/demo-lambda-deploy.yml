name: Deploy-lambda

on:
  pull_request:
    branches:
      - demo
    paths:
      - '*code/lambda/*'
  push:
    branches:
      - demo
    paths:
      - '*code/lambda/*'
  
jobs:
  deploy:
    name: Deploy lambda
    runs-on: ubuntu-latest

    steps:

      - name: Install AWS CLI
        id: install-aws-cli
        uses: unfor19/install-aws-cli-action@master

      
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Lambda packages
        working-directory: code/lambda
        run: |
          echo "create lambda zip"
          zip start_ec2_lambda.zip -r start_ec2_lambda.py
          zip stop_ec2_lambda.zip -r stop_ec2_lambda.py

      - name: Deploy
        working-directory: code/lambda
        env:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
        run: |
          echo "deploy lambda"
          aws configure
          aws lambda update-function-code --function-name start_ec2_lambda --zip-file fileb://start_ec2_lambda.zip
          aws lambda update-function-code --function-name stop_ec2_lambda --zip-file fileb://stop_ec2_lambda.zip
