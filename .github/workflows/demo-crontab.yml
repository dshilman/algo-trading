name: Configure-Crontab-DEMO-EC2

on:
  pull_request:
    branches:
      - demo
    paths:
      - '*code/trading/*'
  push:
    branches:
      - demo
    paths:
      - '*/config/crontab.txt'

jobs:
  deploy:
    name: Deploy to EC2 on demo branch push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the files
        uses: actions/checkout@v2

      - name: Deploy to demo trading server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_HOST: ${{ vars.DEMO_REMOTE_HOST }}
          TARGET: ${{ vars.TARGET }}

      - name: Update Crontab on Remote Server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.DEMO_REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ${{ vars.TARGET }}/config
            crontab crontab.txt
            echo "Crontab updated successfully!"